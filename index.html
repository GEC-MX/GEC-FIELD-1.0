<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com https://api.open-meteo.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="theme-color" content="#0B2545">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GEC FIELD">
<title>GEC FIELD</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2545; --blue:#13315C; --accent:#1D6FB8; --sky:#E3EEF8;
  --gray:#8D99AE; --line:#D9DFE7; --bg:#EEF2F6; --white:#fff; --text:#1B2533; --muted:#5B6878;
  --ok:#1E8E5A; --warn:#C98A00; --bad:#C0392B;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.4}
body{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:84px;background:var(--bg)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--text);width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,111,184,.15)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.03em}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.brand{font-weight:700;letter-spacing:.04em;font-size:16px}
.brand small{display:block;font-weight:500;font-size:11px;color:#A9BCD6;letter-spacing:.02em}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:#4CD38A}
.chip.off .dot{background:#FF6B5E}
.pend{background:#F2B33D;color:#1B2533}
main{padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{font-size:14px;color:var(--blue);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;padding:13px 16px;border-radius:12px;font-weight:600;background:var(--accent);color:#fff;width:100%}
.btn.sec{background:var(--sky);color:var(--blue)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--blue)}
.btn.danger{background:#fff;border:1px solid #E7B7B1;color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:13px;width:auto;border-radius:10px}
.btn:disabled{opacity:.5}
.bar{height:10px;background:#E4E9F0;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));border-radius:999px}
.big{font-size:28px;font-weight:700;color:var(--navy)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
.b-borr{background:#EDEFF3;color:var(--muted)}
.b-pend{background:#FFF1D2;color:#8A5E00}
.b-bad{background:#FBE9E7;color:var(--bad)}
.b-env{background:#DDF3E8;color:var(--ok)}
.b-sending{background:var(--sky);color:var(--accent)}
.list>div{padding:10px 0;border-top:1px solid var(--line)}
.list>div:first-child{border-top:0}
.steps{display:flex;gap:4px;margin:2px 0 6px}
.steps i{flex:1;height:5px;border-radius:3px;background:#D5DCE5}
.steps i.done{background:var(--accent)}
.steps i.cur{background:var(--navy)}
.stephead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.stephead h2{font-size:19px;color:var(--navy)}
.wizfoot{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fff;border-top:1px solid var(--line);padding:10px 14px}
.wizfoot>div{max-width:492px;margin:0 auto;display:flex;gap:10px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fff;border-top:1px solid var(--line)}
nav.tabs>div{max-width:520px;margin:0 auto;display:flex}
nav.tabs button{flex:1;padding:10px 0 12px;font-size:11px;font-weight:600;color:var(--gray);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button.on{color:var(--accent)}
nav.tabs svg{width:22px;height:22px}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check input{width:22px;height:22px;flex:0 0 22px;accent-color:var(--accent)}
.concept{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.concept.act{border-color:var(--accent);background:#F6FAFE}
.clave{font-size:12px;font-weight:700;color:var(--accent)}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ph{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.ph div{padding:8px}
.ph input,.ph select{padding:7px 8px;font-size:13px;margin-bottom:6px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff;position:relative}
.x{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:8px;color:var(--bad);font-size:18px}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sum>div{background:var(--bg);border-radius:10px;padding:10px}
.sum b{display:block;font-size:20px;color:var(--navy)}
.sum span{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;z-index:50;max-width:90%;box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(11,37,69,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:#fff;border-radius:18px 18px 0 0;padding:18px;width:100%;max-width:520px}
.modal h3{color:var(--navy);margin-bottom:6px}
.proto{background:#FFF8E5;border:1px solid #F1DDA6;color:#6B5200;font-size:12.5px;padding:9px 12px;border-radius:10px;margin-bottom:12px}
.empty{text-align:center;color:var(--muted);padding:18px 6px;font-size:13.5px}
.nota{white-space:pre-wrap;font-size:13.5px;background:var(--bg);border-radius:10px;padding:12px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-top:1px dashed var(--line);font-size:13.5px}
.kv:first-child{border-top:0}
.kv span{color:var(--muted)}
.auto{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:600;color:var(--navy)}
.tag{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:var(--accent);background:var(--sky);padding:2px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;vertical-align:middle}
</style>
</head>
<body>
<header>
  <div class="brand">GEC FIELD<small>Diario de Obra · Supervisión</small></div>
  <div class="sp"></div>
  <span id="pendChip"></span>
  <button id="netChip" class="chip" data-action="toggleNet" title="Tocar para simular sin señal"><span class="dot"></span><span id="netTxt">En línea</span></button>
</header>
<main id="app"></main>
<div id="foot"></div>
<div id="toast" class="toast"></div>
<div id="modalRoot"></div>
<input type="file" id="progFile" style="position:fixed;left:-9999px;opacity:0" tabindex="-1">

<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
